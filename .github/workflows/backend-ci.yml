name: Backend CI

# This repository *is* the backend project — its root holds pom.xml and mvnw —
# so every path here is repo-root-relative. There is no "Petrimonium-Backend/"
# subdirectory to filter on or cd into.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

  mutation-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The pitest-maven goal below is invoked directly (not bound to a lifecycle
      # phase) against a fresh checkout on its own runner, so target/classes
      # doesn't exist yet — without this, PIT finds no compiled classes to
      # mutate and fails immediately with "No mutations found" before writing
      # any report.
      - name: Compile
        run: ./mvnw -B test-compile

      - name: PIT mutation coverage (application + core domain)
        run: ./mvnw -B org.pitest:pitest-maven:mutationCoverage

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: target/pit-reports

  dependency-check:
    runs-on: ubuntu-latest
    # Vulnerable-dependency scan against the NVD feed — informational for now (does not
    # block merges) until the project has a process for triaging findings.
    continue-on-error: true
    # Without an NVD API key, NIST's public API rate-limits requests hard enough
    # that this can hang for hours instead of failing. Bound it so a rate-limited
    # run fails fast rather than tying up a runner all day; register a free key at
    # https://nvd.nist.gov/developers/request-an-api-key and add it as the
    # NVD_API_KEY repo secret to avoid the rate limit (and this timeout) entirely.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Cache the NVD vulnerability database between runs so we don't re-download
      # the entire feed on every push (saves ~5 min and avoids rate-limit timeouts).
      - name: Cache OWASP NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      - name: OWASP dependency-check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          OPTS="-DfailOnError=false -DretryCount=3"
          if [ -n "$NVD_API_KEY" ]; then
            OPTS="$OPTS -DnvdApiKey=$NVD_API_KEY"
          fi
          ./mvnw -B --no-transfer-progress org.owasp:dependency-check-maven:check $OPTS

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
