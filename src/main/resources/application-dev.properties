# Local development profile — must be explicitly activated via
# SPRING_PROFILES_ACTIVE=dev (DotenvLoader sets this automatically from a
# local .env file, see .env.example). Carries every permissive/dev-only
# setting that used to live unconditionally in application.properties: H2,
# CORS wildcard, seed data (admin/admin + demo accounts), SQL logging.
#
# Requiring an explicit opt-in — rather than this being the silent default
# whenever no profile is set — means an unconfigured environment now fails
# to start (no datasource at all without dev or prod) instead of silently
# running with dev-permissive settings. See application.properties' header
# comment for the full rationale.

# ===============================
# H2 DATABASE
# ===============================
spring.datasource.url=jdbc:h2:mem:petapp-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# FLYWAY
# ===============================
# db/migration (schema) applies in every environment; db/migration-dev (seed
# data, including the admin/admin test account) is additive here only —
# application-prod.properties overrides this to db/migration alone, so
# production never sees the dev seed data.
spring.flyway.locations=classpath:db/migration,classpath:db/migration-dev

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# See DevSchemalessNamingStrategy: H2 can't run V20's schema-per-context
# split (Postgres-only, db/migration-postgres), so entities' declared
# schemas are ignored here — dev's tables stay unqualified, matching what
# Flyway actually builds in H2.
spring.jpa.properties.hibernate.physical_naming_strategy=com.jf.PetApp.infrastructure.config.DevSchemalessNamingStrategy

# ===============================
# H2 CONSOLE
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.h2.console.settings.web-allow-others=true

# ===============================
# CORS
# ===============================
# Wildcard is fine for local development only — never set this in prod (see
# application-prod.properties, which requires an explicit real origin).
app.cors.allowed-origins=*
