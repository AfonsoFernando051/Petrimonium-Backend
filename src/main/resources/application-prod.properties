# ===============================
# PRODUCTION PROFILE
# ===============================
# Activate with `SPRING_PROFILES_ACTIVE=prod` (or -Dspring.profiles.active=prod).
# Only overrides what differs from application.properties (the dev/default
# profile) — everything not repeated here (JWT/API secrets via DotenvLoader or
# real env vars, security filter chain, etc.) stays the same.

# ===============================
# DATABASE (PostgreSQL — see docs/ARCHITECTURE.md)
# ===============================
# Supplied by the deployment environment; never hardcode real credentials here.
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# ===============================
# FLYWAY
# ===============================
# Schema only — deliberately excludes db/migration-dev (the dev/test seed
# data, including the admin/admin test account). A predictable default admin
# account must never exist in a real database; this is the enforcement point.
#
# db/migration-postgres carries V20 (schema-per-context split,
# docs/BACKEND_MODULE_PLAN.md) — real PostgreSQL only, since it uses
# `ALTER TABLE ... SET SCHEMA`, which H2 (dev/test) does not support
# (confirmed empirically: H2 rejects a cross-schema ALTER TABLE RENAME with
# "Schema name must match"). Dev's tables intentionally stay unqualified in
# H2's default schema — see DevSchemalessNamingStrategy and
# application-dev.properties.
spring.flyway.locations=classpath:db/migration,classpath:db/migration-postgres
spring.flyway.schemas=identity,education,real_portfolio,gamification,pet,ai

# ===============================
# JPA / HIBERNATE
# ===============================
# `validate`, not `create-drop`/`update`: production schema changes go through
# Flyway (see db/migration), never silent auto-DDL that could alter or drop
# real user data. Hibernate only checks the entity mappings match what Flyway
# already applied, and fails loudly (rather than silently) if they don't.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ===============================
# H2 CONSOLE — must never be reachable in production
# ===============================
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# ===============================
# CORS
# ===============================
# Must be set to the real mobile/web app origin(s) via environment variable —
# intentionally left without a wildcard fallback so a misconfigured deploy
# fails closed instead of silently allowing any origin.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ===============================
# CONNECTION POOL (HikariCP)
# ===============================
# Explicit rather than relying on Boot's defaults (10/10/30s/10m/30m, effectively the same
# numbers) — documented here so a real load test has a known starting point to tune from,
# instead of an implicit default nobody has looked at.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# ===============================
# METRICS EXPORT (OTLP)
# ===============================
# Pushes JVM/HTTP/Hikari-pool metrics on a fixed interval to any OTLP-compatible backend
# (e.g. Grafana Cloud's OTLP gateway). Push, not pull: most PaaS hosts don't let an
# external scraper reach the container, so there's no /actuator/prometheus endpoint to
# expose or secure — the app dials out instead. Off by default so an unconfigured deploy
# doesn't spend every step interval failing to reach a blank URL; set OTLP_METRICS_ENABLED=true
# once OTLP_METRICS_URL and OTLP_METRICS_AUTH are supplied (Grafana Cloud: the account's OTLP
# endpoint URL and an "Authorization: Basic <base64 instanceId:apiKey>" header value).
management.otlp.metrics.export.enabled=${OTLP_METRICS_ENABLED:false}
management.otlp.metrics.export.url=${OTLP_METRICS_URL:}
management.otlp.metrics.export.headers.Authorization=${OTLP_METRICS_AUTH:}
