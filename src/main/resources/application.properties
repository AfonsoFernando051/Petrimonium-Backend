# Base configuration — always loaded, regardless of which Spring profile is
# active. Contains ONLY environment-agnostic settings; every permissive/
# dev-only setting (H2, CORS wildcard, dev seed data, SQL logging) now lives
# in application-dev.properties, which must be explicitly requested via
# SPRING_PROFILES_ACTIVE=dev (see .env.example — DotenvLoader sets it
# automatically for local dev).
#
# Why: previously this file WAS the dev config, active by default whenever
# no profile was set — so a production deployment that forgot to set
# SPRING_PROFILES_ACTIVE=prod silently got CORS *, an open H2 console, and
# seeded admin/admin credentials. Now there is no datasource configured at
# all without an explicit dev or prod profile, so a missing profile fails
# to start instead of silently running unsafe.
spring.application.name=PetApp
server.port=8081

# ===============================
# JPA / HIBERNATE / FLYWAY
# ===============================
# Flyway owns the schema in every real environment; Hibernate only
# validates entity mappings against it. Dev additionally layers seed data
# via application-dev.properties overriding spring.flyway.locations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

spring.devtools.restart.enabled=false

# ===============================
# ACTUATOR
# ===============================
# Only /actuator/health is exposed (permitAll in SecurityConfig) — a load balancer or
# orchestrator needs this to know the instance is alive. Everything else stays off by
# default rather than exposing env/beans/etc.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# ===============================
# CORS
# ===============================
# Deliberately absent here (no default): SecurityConfig's
# corsConfigurationSource() treats a blank value as "no cross-origin access
# allowed" — the mobile app doesn't need CORS at all (native HTTP client),
# so an unconfigured environment should never fall back to permissive.
# application-dev.properties sets the wildcard for local browser tools
# (H2 console, curl-from-browser testing); application-prod.properties
# requires ${CORS_ALLOWED_ORIGINS} with no fallback.

# ===============================
# SECRETS
# ===============================
# jwt.secret, api.brapi.token, api.libretranslate.key, api.anthropic.key and
# api.gemini.key are intentionally left blank here — they're supplied via a local, git-ignored
# `.env` file (see .env.example) or real environment variables in
# production, never committed to source control. See DotenvLoader.
jwt.secret=
jwt.expiration=3600000

# Comma-separated OAuth 2.0 Client IDs from Google Cloud Console that this backend
# accepts as valid audiences for "Sign in with Google" ID tokens (typically the
# Android client ID and the Web client ID used as the mobile app's serverClientId —
# see petapp_mobile's google_sign_in setup). Blank locally disables Google login
# (every token fails verification) until real client IDs are supplied.
google.oauth.client-ids=

# ===============================
# REFRESH TOKENS
# ===============================
app.refresh-token.expiration-days=30

# ===============================
# SIMULATED PORTFOLIO (Academy)
# ===============================
# Starting virtual balance for a brand-new simulated portfolio, in BRL — see
# SimulatedPortfolioProperties. Purely educational: never real money, never
# read by real_portfolio. Applied once, on first access per user; changing
# this value has no effect on portfolios that already exist.
app.simulated-portfolio.initial-balance=10000.00

# ===============================
# RATE LIMITING / TRUSTED PROXIES
# ===============================
# Comma-separated CIDR ranges (e.g. 10.0.0.0/8) whose X-Forwarded-For header
# RateLimitingFilter is allowed to trust for client-IP resolution. Empty by
# default — the app is not yet deployed behind a known reverse proxy/load
# balancer, so X-Forwarded-For is NEVER trusted anywhere until this is
# explicitly configured for the real production topology (see
# RateLimitingFilter's trustedProxies handling). An unconfigured or
# misconfigured proxy in front of the app could otherwise let a client
# spoof this header to bypass rate limiting entirely.
app.security.trusted-proxies=

# ===============================
# EXTERNAL APIS
# ===============================
api.brapi.token=
api.brapi.baseUrl=https://brapi.dev

# Real B3/brokerage sync — no legitimate integration, SDK, or credentials
# exist yet (docs/BACKEND_MODULE_PLAN.md §13). app.b3-sync.enabled must be
# explicitly set to true AND api.b3.token non-blank for
# B3RealPortfolioSyncAdapter.isEnabled() to ever return true — until then
# every sync attempt is logged as DISABLED, never fabricated as a real sync.
app.b3-sync.enabled=false
api.b3.token=
api.b3.baseUrl=

# LibreTranslate: translates onboarding content into the languages exposed by
# the app's Settings screen (pt is canonical, en/es are translated on demand).
# Public instance has rate limits; point to a self-hosted instance in production.
api.libretranslate.url=https://libretranslate.com
api.libretranslate.key=

# Anthropic (Claude): the AI Investment Mentor's primary chat provider (see
# docs/AI_MENTOR.md). The key is server-side only and never sent to the mobile client.
api.anthropic.key=
api.anthropic.model=claude-opus-5
api.anthropic.baseUrl=https://api.anthropic.com/v1

# Gemini: the Mentor's fallback provider if the Anthropic call fails (rate limit,
# outage, missing key). See MentorChatFallbackClient.
api.gemini.key=
api.gemini.model=gemini-2.0-flash
api.gemini.baseUrl=https://generativelanguage.googleapis.com/v1beta

# ===============================
# MAIL (forgot-password flow)
# ===============================
# SMTP credentials for sending password-reset emails, supplied the same way as the API keys
# above (.env locally, real env vars in production). If spring.mail.host is blank —
# JavaMailPasswordResetMailerAdapter logs the reset link instead of sending an email in
# every profile EXCEPT prod, where a blank host instead fails the request loudly (see that
# class) rather than ever logging a live reset token in a production environment.
#
# Deliberately absent here, not declared blank: Spring Boot's own MailSenderAutoConfiguration
# activates on spring.mail.host merely being *present*, even as an empty string — declaring it
# blank would silently register a real (but unusable, empty-host) JavaMailSender bean, which is
# exactly what used to happen here and broke forgot-password with a 500 (MailParseException on
# the equally-blank app.mail.from). Leave these entirely unset locally; DotenvLoader also now
# treats a blank .env value the same as absent, for the same reason.
