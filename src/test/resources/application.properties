spring.application.name=PetApp
# Satisfies ActiveProfileGuard the same explicit way dev/prod do — this file
# already fully shadows the main classpath resource during `mvn test`, so
# this is the one place that needs to declare it, not a real Spring profile
# switch (no application-test.properties exists, or is needed).
spring.profiles.active=test

# ===============================
# H2 DATABASE (in-memory, per test run)
# ===============================
spring.datasource.url=jdbc:h2:mem:petapp-test-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# FLYWAY
# ===============================
# Disabled for the test suite: tests keep using Hibernate's own
# create-drop (below) to build a fresh schema per run from the entity
# mappings directly, same as before Flyway was introduced. This is a
# deliberate choice to avoid coupling the test suite's schema to the
# migration files — if that coupling is ever wanted (e.g. a dedicated test
# validating the migrations themselves), do it as its own explicit test
# rather than by flipping this flag.
spring.flyway.enabled=false

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Entities now declare a schema per bounded context (docs/BACKEND_MODULE_PLAN.md);
# create-drop must issue "create schema if not exists" for each one, or H2
# rejects the schema-qualified table names.
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.h2.console.enabled=false

# ===============================
# SECRETS (test-only — never used outside the test JVM, not a real secret)
# ===============================
# This file lives on the test classpath only (src/test/resources) and fully
# shadows src/main/resources/application.properties during `mvn test`, so
# DotenvLoader (which only runs from PetAppApplication.main()) never needs to
# execute for @SpringBootTest/@WebMvcTest contexts to start.
jwt.secret=test-only-jwt-signing-key-never-used-outside-the-test-suite-0123456789
jwt.expiration=3600000

# ===============================
# EXTERNAL APIS (left blank — external clients already no-op/fallback safely)
# ===============================
api.brapi.token=
api.libretranslate.url=https://libretranslate.com
api.libretranslate.key=
api.gemini.key=
api.gemini.model=gemini-2.0-flash
api.gemini.baseUrl=https://generativelanguage.googleapis.com/v1beta

# ===============================
# SIMULATED PORTFOLIO (Academy)
# ===============================
app.simulated-portfolio.initial-balance=10000.00
